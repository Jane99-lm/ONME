<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06130e"><title>ONME · Living Jade</title>
<style>
:root{--state:#cf9c93;--ink:#e6e9d6;--muted:#a2b6a5;--surface:#06130e}
html,body{margin:0;width:100%;height:100%;background:var(--surface);overflow:hidden;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
canvas{width:100%;height:100svh;display:block;touch-action:none;outline:none}
canvas:focus-visible{outline:1px solid #688c73;outline-offset:-8px}
header{position:fixed;top:max(28px,env(safe-area-inset-top));left:32px;right:32px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.brand{font-size:14px;font-weight:600;letter-spacing:.20em}
#month{font:12px ui-monospace,monospace;letter-spacing:.09em;color:var(--muted)}
.state{position:fixed;left:32px;bottom:max(36px,env(safe-area-inset-bottom));opacity:0;translate:0 4px;filter:blur(2px);transition:opacity 500ms ease-in-out,translate 500ms ease-in-out,filter 500ms ease-in-out;pointer-events:none}
.ready .state{opacity:1;translate:none;filter:none}
.status-line{display:flex;align-items:center;gap:10px}
.dot{background:var(--state);width:5px;height:5px;border-radius:50%;box-shadow:0 0 12px var(--state)}
#state{font-size:18px;color:#e5e8d6;font-weight:400;letter-spacing:-.04em}
.note{font-size:12px;color:var(--muted);margin:10px 0 0;letter-spacing:.02em}
#day-marker{position:fixed;left:0;top:0;pointer-events:none;opacity:0;transition:opacity 350ms ease-in-out;will-change:transform}
#day-marker.visible{opacity:1}
.marker-content{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%)}
#selected-number{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:40px;line-height:1.2;color:#f3eeda;text-shadow:0 1px 15px #07100b;letter-spacing:-.04em;padding:0 12px 10px}
.marker-line{width:1px;height:38px;background:linear-gradient(#d9dac58c,#d9dac544)}
.marker-line::after{content:"";display:block;width:3px;height:3px;background:#ece8d1;position:absolute;bottom:0;left:calc(50% - 1px);border-radius:50%}
#hint{position:fixed;right:32px;bottom:36px;color:var(--muted);opacity:0;pointer-events:none;font-size:12px;transition:opacity 500ms ease-in-out}
.ready #hint{opacity:1}#hint.dismissed{opacity:0}.restricted #hint{display:none}
[role=status]{position:fixed;inset:45% 20px auto;text-align:center;font-size:14px;color:#e2e8d1}
[role=status]:empty{display:none}
@media(prefers-reduced-motion:reduce){.state,#day-marker,#hint{transition:none;filter:none;translate:none}}
@media(max-width:450px){header{left:20px;right:20px;top:24px}.state{left:20px;bottom:28px}#hint{left:20px;right:auto;bottom:94px}#month{font-size:11px}.brand{font-size:13px}#selected-number{font-size:36px}}
</style>
<style>
:root[data-theme=light]{--ink:#183d2c;--muted:#4c6757;--surface:#ffffff}
#state,#selected-number{color:var(--ink)}
:root[data-theme=light] #selected-number{text-shadow:none}
:root[data-theme=light] .marker-line{background:#4c675799}
:root[data-theme=light] .marker-line::after{background:#345540}
#theme-toggle{position:fixed;top:70px;right:32px;min-width:92px;min-height:44px;padding:0 16px;border:1px solid #688c7366;border-radius:24px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
#theme-toggle:focus-visible{outline:2px solid #72c7b3;outline-offset:3px}
#ground-shadow{position:fixed;left:3%;top:70%;width:94%;height:58px;border-radius:50%;background:rgba(0,0,0,.74);filter:blur(24px);transform:rotate(-17deg);pointer-events:none;opacity:0;transition:opacity .5s}
.ready #ground-shadow{opacity:1}
:root[data-theme=light] #ground-shadow{background:rgba(61,65,50,.40);filter:blur(22px)}
[data-embedded=true] #theme-toggle{display:none}
.restricted #theme-toggle{display:none}
</style>
